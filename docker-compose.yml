services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ielts_coach
      POSTGRES_USER: ielts
      POSTGRES_PASSWORD: ielts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ielts -d ielts_coach"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ielts:ielts@postgres:5432/ielts_coach
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ielts:ielts@postgres:5432/ielts_coach
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      FASTEMBED_CACHE_PATH: /models/fastembed
      HUGGINGFACE_CACHE_PATH: /models/huggingface
      HF_HOME: /models/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - uploads:/data/uploads
      - model_cache:/models

  worker:
    build: ./backend
    command: rq worker ingestion evaluations --url redis://redis:6379/0
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ielts:ielts@postgres:5432/ielts_coach
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /data/uploads
      FASTEMBED_CACHE_PATH: /models/fastembed
      HUGGINGFACE_CACHE_PATH: /models/huggingface
      HF_HOME: /models/huggingface
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads
      - model_cache:/models

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        BACKEND_INTERNAL_URL: http://api:8000
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
      BACKEND_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  uploads:
  model_cache:
